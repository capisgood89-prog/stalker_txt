<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зона: флешка Стрелка</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#14160f;--pn:#1d2016;--ln:#454a33;--tx:#d9c98a;--dm:#8a8760;--ac:#e0a02c;--bad:#c25b44;--rad:#8fb04a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14160f}}
:root[data-theme="dark"]{--bg:#14160f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "PT Mono","Courier New",monospace}
.w{max-width:760px;margin:0 auto;padding:14px}
.box{border:1px solid var(--ln);background:var(--pn);padding:10px 12px;margin-bottom:12px}
.st{display:flex;flex-wrap:wrap;gap:6px 18px}.st b{color:var(--ac);font-weight:400}.dm{color:var(--dm)}
.m{height:6px;background:#0c0d08;margin-top:3px}.m i{display:block;height:100%}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.cols{grid-template-columns:1fr}}
h2{font-size:16px;font-weight:400;color:var(--ac);margin:0 0 6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);padding:8px 12px;cursor:pointer;text-align:left}
button.s{padding:1px 8px;font-size:13px}
button:hover,button:focus-visible{border-color:var(--ac);color:#fff;outline:none}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.act{display:grid;gap:6px}
.txt{border-left:3px solid var(--ac);padding-left:12px;max-width:68ch}
.warn{color:var(--bad)}.lg p{margin:2px 0;color:var(--dm)}.lg p:first-child{color:var(--tx)}
</style></head><body><div class="w">
<div class="box st" id="st"></div>
<div class="cols"><div class="box" id="eq"></div><div class="box" id="iv"></div></div>
<div class="box"><h2 id="pl"></h2><div class="txt" id="tx"></div></div>
<div class="act" id="ac"></div>
<div class="box lg" id="lg" style="margin-top:12px"></div>
</div>
<script>
const W={pm:{n:"ПМ",d:1,p:0},obrez:{n:"Обрез",d:2,p:250},aks:{n:"АКС-74У",d:3,p:600},svd:{n:"СВД",d:4,p:1400}};
const A={jk:{n:"Куртка новичка",a:0,p:0},koz:{n:"Кожаная куртка",a:1,p:200},zar:{n:"Комбез «Заря»",a:2,p:800},exo:{n:"Экзоскелет",a:4,p:2600}};
const AR={thorn:{n:"Колючка",p:100},jelly:{n:"Медуза",p:150},flash:{n:"Вспышка",p:300},blood:{n:"Каменная кровь",p:250},soul:{n:"Душа",p:450}};
const IT={ammo:{n:"Патроны",p:7},med:{n:"Аптечка (+40 hp)",p:60,u:s=>s.hp=Math.min(100,s.hp+40)},anti:{n:"Антирад (−40 рад)",p:70,u:s=>s.rad=Math.max(0,s.rad-40)},vodka:{n:"Водка (−15 рад)",p:30,u:s=>s.rad=Math.max(0,s.rad-15)},food:{n:"Тушёнка (+15 hp)",p:25,u:s=>s.hp=Math.min(100,s.hp+15)},bolt:{n:"Болты",p:2},junk:{n:"Хабар",p:35}};
const E={dog:{n:"Слепые псы",s:2,c:2,l:30},boar:{n:"Кабаны",s:2,c:2,l:25},zomb:{n:"Зомби",s:3,c:3,l:20},band:{n:"Бандиты",s:3,c:3,l:90,f:"band"},mil:{n:"Военный патруль",s:4,c:4,l:130,f:"mil"},blood:{n:"Кровосос",s:5,c:5,l:220}};
const F={sol:"Одиночки",band:"Бандиты",duty:"Долг",mil:"Военные"};
const LO={
cordon:{n:"Кордон",rad:0,d:1,en:["dog","boar","band"],f:"sol",nb:["swamp","dump"],sh:1,tr:"s",rest:0,t:"Блокпост и бункер Сидоровича. Здесь начинают все. Торговец ждёт тех, кто вернётся с хабаром."},
swamp:{n:"Болота",rad:3,d:2,en:["dog","boar","zomb"],f:"sol",nb:["cordon","wild"],t:"Топь, ржавые камыши, туман по колено. Аномалии прячутся в воде."},
dump:{n:"Свалка",rad:2,d:2,en:["dog","band","boar"],f:"band",nb:["cordon","bar","agro"],t:"Горы техники и мусора. Территория бандитов. Дальше путь к Бару и Агропрому."},
agro:{n:"Агропром",rad:1,d:3,en:["mil","dog","band"],f:"mil",nb:["dump","dark"],t:"Бывший НИИ за колючкой. Под ним лабиринт подземелий, наверху военные."},
bar:{n:"Бар «100 рентген»",rad:0,d:0,en:[],f:"duty",nb:["dump","wild","dark"],sh:1,tr:"b",rest:1,t:"Склад в центре Зоны, под защитой Долга. Выпивка, торговля и тёплый ночлег."},
wild:{n:"Дикая территория",rad:2,d:2,en:["boar","dog","zomb"],f:"sol",nb:["bar","swamp"],t:"Заросшие поля и брошенная ферма. Дико, пусто, опасно."},
dark:{n:"Тёмная долина",rad:4,d:4,en:["band","blood","zomb"],f:"band",nb:["bar","agro","mil"],t:"Лаборатория X-18 где-то под землёй. Радиация сильная, бандиты хуже радиации."},
mil:{n:"Военные склады",rad:3,d:5,en:["mil","blood","zomb"],f:"mil",nb:["dark"],t:"Ангары и бетонные бункеры. Здесь прячут Документы Стрелка. Патрули стреляют без предупреждения."}};
const C={cordon:{bolt:5,food:2},swamp:{art:"jelly"},dump:{ammo:16,rub:100},agro:{w:"aks"},wild:{med:2,anti:1},dark:{art:"soul"},mil:{flash:1,ammo:20}};
const SH={s:[["i","ammo",8],["i","med",1],["i","bolt",5],["i","food",1],["a","koz"],["w","obrez"]],b:[["i","ammo",8],["i","med",1],["i","anti",1],["i","vodka",1],["i","food",1],["i","bolt",5],["w","obrez"],["w","aks"],["w","svd"],["a","koz"],["a","zar"],["a","exo"]]};
let s;const $=i=>document.getElementById(i),R=n=>Math.floor(Math.random()*n),P=p=>Math.random()<p,ar=()=>A[s.a].a;
const fresh=()=>({hp:100,rad:0,rub:150,turn:0,loc:"cordon",inv:{ammo:8,med:1,anti:0,vodka:0,food:1,bolt:2,junk:0},art:[],wo:["pm"],ao:["jk"],w:"pm",a:"jk",rep:{sol:0,band:0,duty:0,mil:0},cache:{},flash:0,em:12,log:["Ты на Кордоне. Найди Документы Стрелка на Военных складах и принеси их Сидоровичу или продай Долгу."],enc:null,mode:"",over:""});
function lg(m){s.log.unshift(m);s.log=s.log.slice(0,7)}
function tick(){s.turn++;const L=LO[s.loc],g=Math.round(L.rad*(1-.2*ar()));if(g>0)s.rad=Math.min(120,s.rad+g);
 if(s.rad>=50)s.hp-=s.rad>=80?6:3;
 if(--s.em==2)lg("Небо на севере наливается красным. Скоро выброс, нужно укрытие в здании или подвале (см. «Места в локации»).");
 if(s.em<=0){if(L.sh)lg("Выброс прошёл над Зоной. Ты пересидел его в укрытии.");else{const d=Math.max(15,70-ar()*12);s.hp-=d;s.rad=Math.min(120,s.rad+15);lg(`Выброс застал тебя на открытом месте! −${d} здоровья, +15 радиации.`)}s.em=12+R(5);s.fresh=1}
 if(s.rad>=100)s.hp=0}
function gArt(){const L=LO[s.loc],k=Object.keys(AR)[Math.min(4,R(3)+(L.d>>1))];s.art.push(k);lg(`Найден артефакт: ${AR[k].n}!`)}
function anom(){const L=LO[s.loc];if(s.inv.bolt>0){s.inv.bolt--;if(P(.6)){lg("Болт показал безопасный путь через аномалию.");gArt()}else lg("Болт сгорел. Аномалию пришлось обойти.")}else{const d=Math.max(5,10+L.d*5-ar()*4);s.hp-=d;lg(`Без болтов ты влетел в аномалию. −${d} здоровья.`);if(P(.3))gArt()}}
function enc(k){const e=E[k];if(e.f&&s.rep[e.f]>=2){lg(`${e.n} узнали тебя и пропустили.`);return}s.enc=k;lg(`Опасность: ${e.n}!`)}
function explore(){const L=LO[s.loc];tick();if(s.fresh){s.fresh=0;if(P(.7)){lg("После выброса на земле светится артефакт.");gArt();return}}
 const r=Math.random();
 if(r<.2+L.d*.05)enc(L.en[R(L.en.length)]);else if(r<.45)anom();else if(r<.6){const j=1+R(2);s.inv.junk+=j;lg(`Нашёл хабар ×${j}. Его можно продать.`)}else if(r<.72){const n=4+R(5);s.inv.ammo+=n;lg(`Нашёл патроны ×${n}.`)}else if(r<.8){s.inv.food++;lg("Нашёл банку тушёнки.")}else lg("Тихо. Только ветер и далёкая стрельба.")}
function go(to){tick();s.loc=to;lg(`Ты добрался: ${LO[to].n}.`);const L=LO[to];if(L.en.length&&P(.2+L.d*.04))enc(L.en[R(L.en.length)])}
function fight(){const e=E[s.enc];s.inv.ammo-=e.c;const ch=Math.min(.92,Math.max(.15,.4+.14*W[s.w].d-.06*e.s+.04*ar()));
 if(P(ch)){s.rub+=e.l;s.inv.junk+=R(2);if(e.f)s.rep[e.f]=Math.max(-3,s.rep[e.f]-1);lg(`${e.n} разбиты. Добыча: ${e.l} руб.`);s.enc=null}else{const d=Math.max(8,e.s*9-ar()*5+R(10));s.hp-=d;lg(`${e.n} теснят тебя. −${d} здоровья. Бой не окончен.`)}tick()}
function flee(){const e=E[s.enc];if(P(.5+.05*ar())){lg("Ушёл от погони.");s.enc=null}else{const d=Math.max(5,e.s*5-ar()*3);s.hp-=d;lg(`Убежать не вышло. −${d} здоровья.`)}tick()}
function search(){tick();if(s.cache[s.loc]){lg("Тайник здесь уже вскрыт.");return}
 if(!C[s.loc]){lg("Тайников здесь нет.");return}
 if(!P(.45)){lg("Тайник не нашёл. Можно попробовать ещё.");return}
 s.cache[s.loc]=1;const c=C[s.loc],t=[];for(const k in c){const v=c[k];if(k=="art"){s.art.push(v);t.push(AR[v].n)}else if(k=="w"){s.wo.push(v);t.push(W[v].n)}else if(k=="flash"){s.flash=1;t.push("Документы Стрелка")}else if(k=="rub"){s.rub+=v;t.push(v+" руб.")}else{s.inv[k]+=v;t.push(IT[k].n.split(" (")[0]+" ×"+v)}}lg("Тайник вскрыт: "+t.join(", ")+".")}
function talk(h){const f=LO[s.loc].f;tick();if(h){if(s.inv.ammo<3)return lg("Нечем помочь: нужно 3 патрона.");s.inv.ammo-=3;s.rep[f]=Math.min(3,s.rep[f]+1);s.rub+=60;lg(`Помог группировке «${F[f]}». Репутация растёт, награда 60 руб.`)}else{s.rep[f]=Math.max(-3,s.rep[f]-1);s.rub+=80;lg(`Обманул «${F[f]}» на 80 руб. Репутация падает.`)}}
const disc=()=>{const f=LO[s.loc].f,r=s.rep[f]||0;let d=1-(s.fac==f?.1+.05*Math.max(0,r):(r>=2?.1:0));if(s.fl&&s.fl.bardisc&&s.loc=="bar")d-=.15;return Math.max(.55,d)},price=x=>Math.round(x*disc());
const sellV=()=>s.inv.junk*35+s.art.reduce((a,k)=>a+AR[k].p,0);
function buy(x){const[t,k,q]=x,p=price(t=="i"?IT[k].p*q:t=="w"?W[k].p:A[k].p);if(s.rub<p)return lg("Не хватает денег.");s.rub-=p;if(t=="i")s.inv[k]+=q;else if(t=="w")s.wo.push(k);else s.ao.push(k);lg("Куплено.")}
function btn(p,t,f,c){const b=document.createElement("button");b.textContent=t;if(c)b.className=c;b.onclick=()=>{f();if(s.hp<=0)s.over="dead";render()};p.appendChild(b)}
function render(){
 const L=LO[s.loc],m=(v,c)=>`<div class="m"><i style="width:${Math.min(100,Math.max(0,v))}%;background:${c}"></i></div>`;
 $("st").innerHTML=`<div>Здоровье <b>${Math.max(0,s.hp)}</b>${m(s.hp,"var(--bad)")}</div><div>Радиация <b>${s.rad}</b>${m(s.rad,"var(--rad)")}</div><div>Рубли <b>${s.rub}</b></div><div>Ход <b>${s.turn}</b></div><div class="${s.em<=3?'warn':'dm'}">${s.em<=3?'Выброс близко!':'Выброс не скоро'}</div><div class="dm">${Object.keys(F).map(k=>F[k]+": "+s.rep[k]).join(" | ")}</div>`;
 $("eq").innerHTML=`<h2>Снаряжение</h2><div class="it"><span>Оружие: ${W[s.w].n}</span></div><div class="it"><span>Броня: ${A[s.a].n}</span></div><div id="ee"></div>`;
 [...s.wo.filter(k=>k!=s.w).map(k=>["w",k]),...s.ao.filter(k=>k!=s.a).map(k=>["a",k])].forEach(([t,k])=>{const d=document.createElement("div");d.className="it";d.innerHTML=`<span class="dm">${(t=="w"?W:A)[k].n}</span>`;btn(d,"Надеть",()=>{if(t=="w")s.w=k;else s.a=k},"s");$("ee").appendChild(d)});
 $("iv").innerHTML=`<h2>Инвентарь</h2><div id="ii"></div>`;
 Object.keys(IT).forEach(k=>{if(!s.inv[k])return;const d=document.createElement("div");d.className="it";d.innerHTML=`<span>${IT[k].n} ×${s.inv[k]}</span>`;if(IT[k].u)btn(d,"Использовать",()=>{s.inv[k]--;IT[k].u(s)},"s");$("ii").appendChild(d)});
 $("ii").insertAdjacentHTML("beforeend",s.art.length?`<div class="dm">Артефакты: ${s.art.map(k=>AR[k].n).join(", ")}</div>`:`<div class="dm">Артефактов нет</div>`);
 if(s.flash)$("ii").insertAdjacentHTML("beforeend",`<div style="color:var(--ac)">Документы Стрелка</div>`);
 $("lg").innerHTML=s.log.map(x=>`<p>${x}</p>`).join("");
 const a=$("ac");a.innerHTML="";
 if(s.over){const o={dead:["Ты погиб","Зона не прощает ошибок. Твой КПК ещё долго мигает в траве."],good:["Ты стал легендой Кордона","Сидорович проверяет документы и молча отсчитывает 3000 рублей. — Добро пожаловать в Зону, Стрелок."],duty:["Долг доволен","Долг платит 3000 рублей и открывает перед тобой все двери Бара. Но документы уже не вернуть."]}[s.over];
  $("pl").textContent="Конец";$("tx").innerHTML=`<p><b>${o[0]}</b></p><p>${o[1]}</p><p class="dm">Ходов: ${s.turn}</p>`;btn(a,"Начать заново",()=>{s=fresh()});return}
 $("pl").textContent=L.n+(L.f?" ("+F[L.f]+")":"");$("tx").innerHTML=`<p>${L.t}</p>${s.enc?`<p class="warn">Перед тобой ${E[s.enc].n}.</p>`:""}`;
 if(s.enc){const e=E[s.enc];if(s.inv.ammo>=e.c)btn(a,`Стрелять (−${e.c} патр.)`,fight);btn(a,"Бежать",flee);return}
 if(s.mode=="shop"){SH[L.tr].forEach(x=>{const[t,k,q]=x;if(t!="i"&&(t=="w"?s.wo:s.ao).includes(k))return;const nm=t=="i"?IT[k].n.split(" (")[0]+" ×"+q:t=="w"?W[k].n:A[k].n,p=price(t=="i"?IT[k].p*q:t=="w"?W[k].p:A[k].p);btn(a,`Купить: ${nm} — ${p} руб.`,()=>buy(x))});
  btn(a,`Продать хабар и артефакты (${sellV()} руб.)`,()=>{if(!sellV())return lg("Продавать нечего.");s.rub+=sellV();s.inv.junk=0;s.art=[];lg("Всё продано.")});btn(a,"Назад",()=>s.mode="");return}
 L.nb.forEach(k=>btn(a,"Идти: "+LO[k].n+` (рад. ${LO[k].rad}, опасность ${LO[k].d})`,()=>go(k)));
 if(L.d)btn(a,"Исследовать местность",explore);
 if(C[s.loc]&&!s.cache[s.loc])btn(a,"Искать тайник",search);
 if(L.tr)btn(a,"Торговать"+(disc()<1?` (скидка ${Math.round((1-disc())*100)}%)`:""),()=>s.mode="shop");
 if(L.f&&s.loc!="bar"||s.loc=="bar"){btn(a,`Помочь «${F[L.f]}» (−3 патр.)`,()=>talk(1));btn(a,`Обмануть «${F[L.f]}»`,()=>talk(0))}
 if(L.rest)btn(a,"Отдохнуть (20 руб.): +30 hp, −10 рад",()=>{if(s.rub<20)return lg("Нет денег на ночлег.");s.rub-=20;s.hp=Math.min(100,s.hp+30);s.rad=Math.max(0,s.rad-10);tick();tick();lg("Ты выспался под крышей Бара.")});
 if(s.flash&&s.loc=="cordon")btn(a,"Отдать документы Сидоровичу",()=>{s.over="good"});
 if(s.flash&&s.loc=="bar")btn(a,"Продать документы Долгу",()=>{s.over="duty"});
}
</script><script>
Object.assign(F,{free:"Свобода",sci:"Учёные",merc:"Наёмники",mono:"Монолит"});
Object.assign(W,{tos:{n:"ТОЗ-34",d:2,p:350},ak74:{n:"АК-74",d:3,p:900},vss:{n:"ВСС «Винторез»",d:4,p:1800},an94:{n:"АН-94 «Абакан»",d:5,p:3000}});
Object.assign(A,{stk:{n:"Куртка бандита",a:1,p:150},merc:{n:"Комбез наёмника",a:3,p:1700},sev:{n:"СЕВА",a:4,p:3400},mono:{n:"Броня Монолита",a:5,p:5000}});
const hl=(n)=>s=>s.hp=Math.min(100,s.hp+n);
Object.assign(IT,{bint:{n:"Бинт (+15 hp)",p:20,u:hl(15)},sci:{n:"Научная аптечка (+70 hp)",p:140,u:hl(70)},bread:{n:"Хлеб (+8 hp)",p:10,u:hl(8)},kolb:{n:"Колбаса (+20 hp)",p:30,u:hl(20)},energy:{n:"Энергетик (+25 hp, +5 рад)",p:40,u:s=>{hl(25)(s);s.rad+=5}},lamp:{n:"Фонарь (тайники легче)",p:120},nvg:{n:"ПНВ (обходит врагов)",p:600},det:{n:"Детектор аномалий",p:500},resp:{n:"Респиратор (−1 рад/ход)",p:200}});
Object.assign(E,{snork:{n:"Снорки",s:4,c:4,l:110},ctrl:{n:"Контролёр",s:6,c:6,l:260},merc:{n:"Наёмники",s:5,c:5,l:180,f:"merc"},mono:{n:"Бойцы Монолита",s:6,c:6,l:300,f:"mono"}});
Object.assign(LO,{
cemetery:{n:"Кладбище техники",rad:2,d:3,en:["dog","band","snork"],f:"free",nb:["dump","agro"],tr:"m",t:"Свалка танков и грузовиков, ржавый металл скрипит на ветру. Здесь Свобода держит мастерскую."},
agrou:{n:"Подземелья Агропрома",rad:1,d:4,en:["snork","zomb","blood"],f:"band",nb:["agro"],sh:1,t:"Тёмные коридоры, с потолка капает вода. Без фонаря здесь трудно искать."},
amber:{n:"Янтарь",rad:3,d:3,en:["zomb","snork","dog"],f:"sci",nb:["wild","dark"],tr:"k",t:"Затопленный завод и научная станция. Учёные скупают артефакты."},
red:{n:"Рыжий лес",rad:4,d:4,en:["snork","blood","merc"],f:"merc",nb:["mil","limansk","radar"],t:"Деревья красные от радиации. Наёмники патрулируют просеки."},
limansk:{n:"Лиманск",rad:3,d:4,en:["mono","snork","zomb"],f:"mono",nb:["red"],t:"Мёртвый город. Пустые улицы и заколоченные окна, за каждым углом тишина."},
radar:{n:"Радар",rad:5,d:5,en:["mono","ctrl","zomb"],f:"mono",nb:["red"],t:"Огромная антенна «Дуга». Пси-излучение режет мысли."}});
LO.mil.nb.push("red");LO.agro.nb.push("agrou","cemetery");LO.dump.nb.push("cemetery");LO.dark.nb.push("amber");LO.wild.nb.push("amber");LO.wild.tr="h";

(()=>{const tg=window.Telegram&&Telegram.WebApp;if(!tg)return;
